<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Company Settings | Product ERP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 24px;
            color: #1f2937;
        }
        .container {
            max-width: 760px;
            margin: 20px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #00000010;
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }
        input, textarea, select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            margin-top: 24px;
            background: #2563eb;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
        }
        .error { color: #b91c1c; }
        .success { color: #166534; }
        .back { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="/">&#8592; Dashboard</a>
    <h1>Company Settings</h1>
    <p>Manage your ERP company information.</p>

    {% for message in messages %}
        <p class="success">{{ message }}</p>
    {% endfor %}

    {% for error in errors %}
        <p class="error">{{ error }}</p>
    {% endfor %}

    <form method="post">
        {% csrf_token %}

        <label for="company_name">Company Name *</label>
        <input id="company_name" name="company_name"
               value="{{ settings.company_name }}" required maxlength="200">

        <label for="address">Company Address</label>
        <textarea id="address" name="address" rows="3">{{ settings.address }}</textarea>

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone"
               value="{{ settings.phone }}" maxlength="30">

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email"
               value="{{ settings.email }}">

        <label for="currency">Currency</label>
        <select id="currency" name="currency">
            <option value="BDT" {% if settings.currency == "BDT" %}selected{% endif %}>BDT - Bangladeshi Taka</option>
            <option value="USD" {% if settings.currency == "USD" %}selected{% endif %}>USD - US Dollar</option>
            <option value="EUR" {% if settings.currency == "EUR" %}selected{% endif %}>EUR - Euro</option>
            <option value="INR" {% if settings.currency == "INR" %}selected{% endif %}>INR - Indian Rupee</option>
        </select>

        <button type="submit">Save Settings</button>
    </form>
</div>
</body>
</html>
